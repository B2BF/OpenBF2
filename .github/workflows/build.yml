name: Build packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            server: bf2_w32ded
          - arch: x64
            server: bf2_w64ded
    env:
      BF2_PYTHON_OUT: ${{ github.workspace }}/out/ci-python/${{ matrix.arch }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      BF2_RELEASE_RUN: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and check the embedded Python runtime
        run: call Code\Build\python\build_python.cmd ${{ matrix.arch }}

      - name: Configure
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --preset msvc-${{ matrix.arch }} -B out/build/ci-${{ matrix.arch }} -DBF2_FRONTIER_DEFAULT_CONTINUE=ON -DBF2_GAME_DIR:PATH="%GITHUB_WORKSPACE%/out/no-game-content" -DBF2_DICE_PY_LIB:FILEPATH="%BF2_PYTHON_OUT%/dice_py.lib" -DBF2_DICE_PY_DLL:FILEPATH="%BF2_PYTHON_OUT%/dice_py.dll"

      - name: Run x86 engine and editor framework checks
        if: matrix.arch == 'x86'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_run_checks bf2_editor_run_checks

      - name: Build the dedicated server
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-${{ matrix.arch }} --target ${{ matrix.server }}

      - name: Build the x86 AI library
        if: matrix.arch == 'x86'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_aidll

      # [CHOSEN, not recovered] The x64 server depends on and stages the native AI library.
      - name: Check the Windows x64 AI exports
        if: matrix.arch == 'x64'
        run: |
          call Code\Build\vsdevcmd.cmd x64
          if errorlevel 1 exit /b 1
          dumpbin /exports out\build\ci-x64\bin_client\aidll.dll > out\build\ci-x64\aidll-exports.txt
          if errorlevel 1 exit /b 1
          type out\build\ci-x64\aidll-exports.txt
          python -c "import re; from pathlib import Path; text=Path('out/build/ci-x64/aidll-exports.txt').read_text(); names=re.findall(r'^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)(?:\s*=\s*\S+)?\s*$', text, re.M); assert sorted(names)==['deinitDll', 'initDll'], names"
          if errorlevel 1 exit /b 1
          fc /b out\build\ci-x64\bin_client\aidll.dll out\build\ci-x64\bin_w64ded\aidll.dll

      # RendDX9.dll and TextureAtlasBuilder.dll, and so the client and the editor, build against the
      # April 2005 DirectX SDK or, on hosted runners without it, the D3DX fallback (Code/Build/dxsdk.cmd).
      # When neither is usable, other runs skip the client (and on x86 the editor) with a notice and leave
      # them out of the packages. Release runs fail here instead: the Windows release package carries
      # both clients and the editor, and a package without them is no release (docs/ci-releases.md).
      - name: Locate the D3DX headers and import library
        id: dxsdk
        run: |
          rem The same call renddx9.cmd and textureatlasbuilder.cmd make: the April 2005 SDK, or
          rem without it the D3DX fallback (BF2_D3DX=auto, Code/Build/dxsdk.cmd).
          call Code\Build\dxsdk.cmd ${{ matrix.arch }} fallback
          if errorlevel 1 (
            if "%BF2_RELEASE_RUN%"=="true" (
              echo ::error title=No D3DX source::Neither the April 2005 DirectX SDK nor the D3DX fallback is usable; the Windows release package needs the ${{ matrix.arch == 'x86' && 'x86 client and editor' || 'x64 client' }}; see docs/ci-releases.md.
              exit /b 1
            )
            echo ::notice title=No D3DX source::Neither the April 2005 DirectX SDK nor the D3DX fallback is usable; the ${{ matrix.arch == 'x86' && 'x86 client and editor are' || 'x64 client is' }} not built on this runner.
            echo found=false>> "%GITHUB_OUTPUT%"
          ) else (
            echo found=true>> "%GITHUB_OUTPUT%"
          )
          exit /b 0

      # Windows ships both clients: x86 (retail's PunkBuster, D3DX and OpenAL from the game folder) and
      # x64 (no PunkBuster). Keep the client/plugin and editor builds sequential within this checkout.
      - name: Build the ${{ matrix.arch }} client with plugins
        if: steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-${{ matrix.arch }} --target bf2_client

      # [CHOSEN, not recovered] OpenAL Soft as both clients' BF2OpenAL.dll, built from the release
      # tarball pinned by URL and SHA-256 in Code/Build/build_openal_soft.py (docs/ci-releases.md).
      # The cache key is the architecture and that script, so a new pin rebuilds.
      - name: Restore the ${{ matrix.arch }} OpenAL Soft build
        if: steps.dxsdk.outputs.found == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/build/ci-${{ matrix.arch }}/openal-soft
          key: openal-soft-${{ matrix.arch }}-${{ hashFiles('Code/Build/build_openal_soft.py') }}

      - name: Build OpenAL Soft for the ${{ matrix.arch }} client
        if: steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          python Code/Build/build_openal_soft.py --arch ${{ matrix.arch }} --stage-dir out/build/ci-${{ matrix.arch }}/openal-soft --work-dir out/openal-soft-work --client-dir out/build/ci-${{ matrix.arch }}/bin_client

      - name: Build the x86 editor with its plugins
        if: matrix.arch == 'x86' && steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_editor

      # The real import lists of the packaged client images (both architectures) and of the x86 editor,
      # for the job log; no image may import NovintHFX.dll (the Falcon is archived,
      # Code/Archive/NovintFalcon). Also the executables' embedded manifests: any requestedExecutionLevel
      # disables UAC file virtualization (retail's BF2.exe has no manifest). Printed only, not changed.
      - name: List the ${{ matrix.arch }} image imports and manifests
        if: steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          set "OUT=out\build\ci-${{ matrix.arch }}"
          set "IMAGES="%OUT%\bin_client\BF2.exe" "%OUT%\bin_client\RendDX9.dll" "%OUT%\bin_client\TextureAtlasBuilder.dll" "%OUT%\bin_client\BF2OpenAL.dll""
          set "EXES="%OUT%\bin_client\BF2.exe""
          if "${{ matrix.arch }}"=="x86" set IMAGES=%IMAGES% "%OUT%\bin_editor\BF2Editor.exe" "%OUT%\bin_editor\RendDX9.dll" "%OUT%\bin_editor\TextureAtlasBuilder.dll"
          if "${{ matrix.arch }}"=="x86" set EXES=%EXES% "%OUT%\bin_editor\BF2Editor.exe"
          for %%I in (%IMAGES%) do (
            echo ===== imports: %%I
            dumpbin /nologo /dependents /imports %%I > "%%~dpnxI.imports.txt"
            if errorlevel 1 exit /b 1
            type "%%~dpnxI.imports.txt"
            findstr /i /c:"NovintHFX" "%%~dpnxI.imports.txt" >nul && (echo ::error title=NovintHFX import::%%~nxI imports NovintHFX.dll& exit /b 1)
            if /i "%%~nxI"=="BF2OpenAL.dll" findstr /i /c:"VCRUNTIME" /c:"MSVCP" /c:"api-ms-win-crt-" /c:"ucrtbase" "%%~dpnxI.imports.txt" >nul && (echo ::error title=OpenAL runtime::BF2OpenAL.dll imports the shared MSVC runtime& exit /b 1)
          )
          for %%E in (%EXES%) do (
            echo ===== manifest: %%E
            mt.exe -nologo "-inputresource:%%~fE;#1" -out:con
            if errorlevel 1 echo   no embedded manifest resource 1, or mt.exe could not read it
          )
          exit /b 0

      # Future Windows signing belongs here, before packaging and checksums.
      # No signing credentials or signing step are configured yet.
      - name: Check packaging fixtures
        run: python Code/Tests/test_package_release.py

      - name: Package Windows binaries
        run: python Code/Build/package_release.py --platform windows-${{ matrix.arch }} --build-dir out/build/ci-${{ matrix.arch }} --output-dir out/packages --revision "%GITHUB_SHA%" --repository "%GITHUB_REPOSITORY%" ${{ steps.dxsdk.outputs.found != 'true' && (matrix.arch == 'x86' && '--omit client --omit editor' || '--omit client') || '' }}

      # The per-role ZIPs (and, with a client, the pinned OpenAL Soft tarball) are CI artifacts; the
      # windows-package job assembles the release package from both legs' artifacts.
      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-${{ matrix.arch }}
          path: |
            out/packages/*.zip
            out/packages/*.sha256
            out/packages/*.tar.bz2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: |
            out/ci-python/**/*.log
            out/build/ci-${{ matrix.arch }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/ci-${{ matrix.arch }}/Testing/Temporary/*.log
            out/build/ci-${{ matrix.arch }}/editor_renddx9/**/*.log
            Code/Build/obj_*_native/*.log
          if-no-files-found: ignore
          retention-days: 7

  # [CHOSEN, not recovered] The Windows release package, openbf2-windows.zip: both clients (x64\, x86\),
  # the x86 dedicated server (server\) and the x86 editor (editor\), assembled from the two legs'
  # per-role ZIPs after checking their checksums and build-info hashes (Code/Build/package_release.py
  # --release windows). Release runs need every component; other runs package what was built, so CI
  # stays green without D3DX, and the README and build-info.json name what is missing.
  windows-package:
    name: Windows package
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BF2_RELEASE_RUN: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check packaging fixtures
        run: python3 Code/Tests/test_package_release.py

      # One folder per artifact: both legs carry the same pinned OpenAL Soft tarball, and the
      # packager checks that the copies are identical.
      - name: Download the Windows per-role packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-windows-*
          path: out/packages

      - name: Assemble the Windows package
        run: |
          allow_missing=--allow-missing
          if [ "$BF2_RELEASE_RUN" = true ]; then allow_missing=; fi
          python3 Code/Build/package_release.py --release windows --packages-dir out/packages --output-dir out/release --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" $allow_missing

      - name: Upload the Windows release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            out/release/*.zip
            out/release/*.sha256
            out/release/*.tar.bz2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ libncurses-dev

      - name: Configure
        run: cmake --preset linux-x64 -B out/build/ci-linux-x64 -DBF2_GAME_DIR:PATH="$GITHUB_WORKSPACE/out/no-game-content"

      - name: Build the dedicated server and check the Python runtime
        run: cmake --build out/build/ci-linux-x64 --target bf2 dice_py_check_run

      - name: Package Linux binaries
        run: python3 Code/Build/package_release.py --platform linux-x64 --build-dir out/build/ci-linux-x64 --output-dir out/packages --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-x64
          path: |
            out/packages/*.zip
            out/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The Linux release package, openbf2-linux.zip: the same files in a platform-named archive.
      - name: Assemble the Linux package
        run: python3 Code/Build/package_release.py --release linux --packages-dir out/packages --output-dir out/release --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Upload the Linux release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            out/release/openbf2-linux.zip
            out/release/openbf2-linux.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-linux-x64
          path: |
            out/build/ci-linux-x64/CMakeFiles/CMakeConfigureLog.yaml
            out/build/ci-linux-x64/CMakeFiles/CMake*.log
          if-no-files-found: ignore
          retention-days: 7

  # [CHOSEN, not recovered] The macOS port: the renderer-on Metal client, the dedicated server and the
  # AI library, one leg per architecture on the Apple-silicon runner, macos-15 (x86_64 is cross-compiled, as the
  # local Intel builds cross-compile arm64). The client needs the native effect compiler, built here
  # from pinned vkd3d-shader 2.1 and MojoShader sources with the repository's patches
  # (tools/macos/nativefx/build.sh, tools/macos/vkd3d-patches).
  # Release runs (a published release, or a v* tag) sign the binaries with the Developer ID from
  # the protected `release` environment; every other run (pull requests, branch pushes, forks)
  # stays ad-hoc and uses no secrets (docs/ci-releases.md). The per-architecture ZIPs are CI
  # artifacts only and not notarized: releases ship the notarized disk image (macos-app).
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 150
    environment: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      BF2_RELEASE_SIGNING: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install flex bison mingw-w64 autoconf automake libtool pkgconf cpanminus vulkan-headers spirv-headers
          # vkd3d's configure needs the Vulkan and SPIR-V headers; /opt/homebrew/include is not on the
          # compiler's default search path on Apple silicon.
          echo "CPPFLAGS=-I$(brew --prefix vulkan-headers)/include -I$(brew --prefix spirv-headers)/include" >> "$GITHUB_ENV"
          # vkd3d's configure needs Perl's JSON module.
          cpanm --notest --local-lib "$HOME/perl5" JSON
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "WIDL=$(brew --prefix mingw-w64)/toolchain-x86_64/bin/x86_64-w64-mingw32-widl" >> "$GITHUB_ENV"

      - name: Fetch the native effect sources
        run: |
          git clone --depth 1 --branch vkd3d-2.1 https://gitlab.winehq.org/wine/vkd3d.git out/third_party/vkd3d
          test "$(git -C out/third_party/vkd3d rev-parse HEAD)" = fb7f9ff3c1f8d972ee6f1b8c6a92caf6c8ba1e10
          (cd out/third_party/vkd3d && ./autogen.sh)
          git clone https://github.com/icculus/mojoshader.git out/third_party/mojoshader
          git -C out/third_party/mojoshader checkout --detach ad5dff84830c2863c841f4b1f4e3df78c705b383

      - name: Build the native effect libraries
        run: sh tools/macos/nativefx/build.sh ${{ matrix.arch }}

      - name: Configure
        run: |
          deps=nativefx
          if [ "${{ matrix.arch }}" = arm64 ]; then deps=nativefx-arm64; fi
          cmake --preset macos-x64 -B out/build/ci-macos-${{ matrix.arch }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBF2_MACOS_LINK_RENDDX9=ON \
            -DBF2_FRONTIER_DEFAULT_CONTINUE=ON \
            -DBF2_FX_NATIVE_DEPS="$GITHUB_WORKSPACE/out/build/$deps" \
            -DBF2_GAME_DIR:PATH="$GITHUB_WORKSPACE/out/no-game-content"

      - name: Build the client, the dedicated server and the AI library
        run: cmake --build out/build/ci-macos-${{ matrix.arch }} --target bf2_client bf2 bf2_aidll

      - name: Check the architecture and the Python runtime
        run: |
          for image in bf2_client bf2 libdice_py.dylib libaidll.dylib; do
            lipo out/build/ci-macos-${{ matrix.arch }}/bin_macos/$image -verify_arch ${{ matrix.arch }}
          done
          # The runner is arm64; the cross-compiled x86_64 images are not executed here.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            cmake --build out/build/ci-macos-arm64 --target dice_py_check_run
          fi

      # Release only, after every build step, so the keychain exists only for signing and packaging.
      # No notary key here: this job notarizes nothing.
      - name: Import the Developer ID certificate (release)
        if: env.BF2_RELEASE_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: bash tools/macos/ci/release-signing.sh import

      - name: Sign the macOS binaries (release)
        if: env.BF2_RELEASE_SIGNING == 'true'
        run: bash tools/macos/ci/release-signing.sh sign-standalone out/build/ci-macos-${{ matrix.arch }}/bin_macos

      - name: Package macOS binaries
        run: |
          signing=adhoc
          if [ "$BF2_RELEASE_SIGNING" = true ]; then signing=developer-id; fi
          python3 Code/Build/package_release.py --platform macos-${{ matrix.arch }} --build-dir out/build/ci-macos-${{ matrix.arch }} --output-dir out/packages --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --macos-signing "$signing"

      - name: Remove the signing keychain and key (release)
        if: always() && env.BF2_RELEASE_SIGNING == 'true'
        run: bash tools/macos/ci/release-signing.sh cleanup

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-${{ matrix.arch }}
          path: |
            out/packages/*.zip
            out/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          path: |
            out/build/ci-macos-${{ matrix.arch }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/nativefx*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # [CHOSEN, not recovered] The macOS app: the separate MIT setup app (kr4uzi/openbf2-setup, pinned
  # below) with the universal client embedded, as a drag-and-drop disk image, openbf2-macos.dmg: the
  # macOS release package. The two macOS legs are
  # merged with lipo; the setup app's own release script builds, tests and verifies the image. Its
  # contract for the client directory is docs/client-artifact.md in that repository.
  # Release runs sign the app with the Developer ID (hardened runtime, timestamp, entitlements),
  # sign, notarize and staple the disk image; other runs keep the setup script's ad-hoc signature.
  macos-app:
    name: macOS app (universal)
    needs: macos
    runs-on: macos-15
    timeout-minutes: 120
    environment: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    env:
      SETUP_REPOSITORY: kr4uzi/openbf2-setup
      SETUP_REVISION: fb6dc8fe8d7b81e41d0b737925891e92568cb61c # v0.3.1
      BF2_RELEASE_SIGNING: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
    steps:
      # The client entitlements, the signing helper and the packager (for the build-info); the app
      # is built from the setup repository.
      - name: Check out the signing files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: out/openbf2
          persist-credentials: false
          sparse-checkout: |
            Code/Build
            tools/macos/ci
          sparse-checkout-cone-mode: true

      - name: Download the macOS client packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-macos-*
          path: out/packages
          merge-multiple: true

      - name: Merge the client legs into a universal client
        working-directory: out
        run: |
          for arch in arm64 x86_64; do
            (cd packages && shasum -a 256 -c "openbf2-macos-$arch-client.zip.sha256")
            ditto -x -k "packages/openbf2-macos-$arch-client.zip" "legs/$arch"
          done
          mkdir client-universal
          for item in bf2_client libdice_py.dylib libaidll.dylib; do
            lipo -create "legs/arm64/openbf2-macos-arm64-client/$item" \
                         "legs/x86_64/openbf2-macos-x86_64-client/$item" \
                 -output "client-universal/$item"
            lipo "client-universal/$item" -verify_arch arm64 x86_64
          done
          chmod +x client-universal/bf2_client

      - name: Check out the setup app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SETUP_REPOSITORY }}
          ref: ${{ env.SETUP_REVISION }}
          path: out/openbf2-setup
          persist-credentials: false

      # The setup app uses header-only Boost.Asio (1.86 or newer); find_package(Boost CONFIG) finds
      # Homebrew's copy, nothing is compiled from Boost.
      - name: Install the Boost headers
        run: |
          brew install boost
          brew list --versions boost

      - name: Prepare the Rust toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked --manifest-path out/openbf2-setup/core/rtp-bridge/Cargo.toml

      - name: Import the Developer ID certificate (release)
        if: env.BF2_RELEASE_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          bash out/openbf2/tools/macos/ci/release-signing.sh import
          bash out/openbf2/tools/macos/ci/release-signing.sh notary-key

      # SETUP_SIGN_IDENTITY unset means ad-hoc. In release runs the setup scripts sign with the
      # imported identity, the hardened runtime, a timestamp and the two entitlements files.
      - name: Build, test and package the app
        run: |
          if [ "$BF2_RELEASE_SIGNING" = true ]; then
            export SETUP_SIGN_IDENTITY="$BF2_SIGN_IDENTITY"
            export SETUP_ENTITLEMENTS_CLIENT="$GITHUB_WORKSPACE/out/openbf2/Code/Build/macos/bf2_client.entitlements"
            export SETUP_ENTITLEMENTS_APP="$GITHUB_WORKSPACE/out/openbf2-setup/macos/OpenBF2.entitlements"
          fi
          bash out/openbf2-setup/macos/build-release.sh "$GITHUB_WORKSPACE/out/client-universal" "$GITHUB_WORKSPACE/out/packages-app/openbf2-macos.dmg" "$GITHUB_WORKSPACE/out/setup-build"

      - name: Sign, check and notarize the disk image (release)
        if: env.BF2_RELEASE_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          dmg=out/packages-app/openbf2-macos.dmg
          bash out/openbf2/tools/macos/ci/release-signing.sh verify-dmg "$dmg"
          bash out/openbf2/tools/macos/ci/release-signing.sh sign-dmg "$dmg"
          bash out/openbf2/tools/macos/ci/release-signing.sh notarize "$dmg"
          bash out/openbf2/tools/macos/ci/release-signing.sh staple "$dmg"

      - name: Remove the signing keychain and key (release)
        if: always() && env.BF2_RELEASE_SIGNING == 'true'
        run: bash out/openbf2/tools/macos/ci/release-signing.sh cleanup

      # After stapling: the ticket changes the image, so the checksum is written last.
      - name: Write the disk image checksum
        working-directory: out/packages-app
        run: |
          rm -f openbf2-macos.dmg.sha256
          shasum -a 256 openbf2-macos.dmg > openbf2-macos.dmg.sha256

      # The disk image cannot hold it (the setup build copies only the client's three files), so the
      # build-info is a CI artifact beside the image: revision, setup app revision, the client's
      # SHA-256s, the image's SHA-256 and the signing and notarization state.
      - name: Write the disk image build-info
        run: |
          signing=adhoc
          if [ "$BF2_RELEASE_SIGNING" = true ]; then signing=developer-id; fi
          python3 out/openbf2/Code/Build/package_release.py --release macos --client-dir out/client-universal --dmg out/packages-app/openbf2-macos.dmg --setup-repository "$SETUP_REPOSITORY" --setup-revision "$SETUP_REVISION" --macos-signing "$signing" --output-dir out/build-info --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Upload the macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            out/packages-app/openbf2-macos.dmg
            out/packages-app/openbf2-macos.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the disk image build-info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info-macos
          path: out/build-info/openbf2-macos.build-info.json
          if-no-files-found: error
          retention-days: 14

name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # A reusable workflow only receives the `release` environment's secrets when the caller
    # passes secrets on; without this they resolve to empty strings.
    secrets: inherit

  upload:
    name: Attach packages to the release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the release-* artifacts: one package per platform. The per-role and per-architecture
      # packages-* artifacts stay CI artifacts (docs/ci-releases.md).
      - name: Download this run's release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Verify and upload all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        working-directory: packages
        shell: bash
        run: |
          # Both Windows clients bundle OpenAL Soft (LGPL): the release carries the exact source.
          shopt -s nullglob
          sources=(openal-soft-*.tar.bz2)
          shopt -u nullglob
          test "${#sources[@]}" -eq 1
          files=(openbf2-macos.dmg openbf2-windows.zip openbf2-linux.zip "${sources[0]}")
          assets=()
          for file in "${files[@]}"; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum --check "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          # Exactly these assets: nothing else may reach the release page.
          expected=$(printf '%s\n' "${assets[@]}" | sort)
          actual=$(ls -A | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error title=Unexpected release files::expected only: ${assets[*]}"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          # build.yml fails release runs without D3DX; check the archive itself as well.
          python3 - <<'EOF'
          import json
          import zipfile

          with zipfile.ZipFile("openbf2-windows.zip") as archive:
              names = set(archive.namelist())
              info = json.loads(archive.read("openbf2-windows/build-info.json"))
          for entry in ("x64/BF2.exe", "x86/BF2.exe", "server/bf2_w32ded.exe", "editor/BF2Editor.exe"):
              assert "openbf2-windows/" + entry in names, "openbf2-windows.zip lacks " + entry
          assert not info.get("omitted"), "openbf2-windows.zip omits " + ", ".join(info["omitted"])
          EOF
          gh release upload --repo "$GH_REPO" --clobber -- "$RELEASE_TAG" "${assets[@]}"

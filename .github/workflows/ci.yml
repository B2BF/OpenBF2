name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      linux_only:
        description: Build only Linux server/client packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      linux_only: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_only }}
    # A reusable workflow only receives the `release` environment's secrets when the caller
    # passes secrets on; without this they resolve to empty strings.
    secrets: inherit
